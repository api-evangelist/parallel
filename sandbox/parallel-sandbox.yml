notes: >-
  Parallel publishes NO separate sandbox environment. There is no test host, no
  test-mode key prefix, no test/live key split, no fixtures and no time
  simulation — every call goes to production api.parallel.ai against the live
  web, which is inherent to a web-research API. What Parallel does publish
  instead is a set of low-cost and no-cost ways to try a call before committing:
  hosted playgrounds, a FindAll `preview` generator, an anonymous free MCP
  endpoint, and monthly free credits. Those are captured below verbatim. Nothing
  here is invented; absent fields are recorded as absent.
separate_sandbox_environment: false
test_mode: false
key_prefixes:
  test: null
  live: null
  note: Single key type, sent as x-api-key. No test/live distinction is documented.
