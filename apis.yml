- aid: parallel:parallel-memory-api
  name: Parallel Memory API
  description: >-
    The Memory API lets agents search and reuse the results of past Task, Monitor and FindAll runs so
    new research builds on work already done. It exposes retrieve, evict and clear operations over the
    stored research corpus, turning repeated web research into a reusable, source-addressable memory rather
    than a fresh crawl every time.
  humanURL: https://docs.parallel.ai/resources/memory
  baseURL: https://api.parallel.ai
  tags:
  - Memory
