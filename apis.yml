aid: parallel
name: Parallel
description: >-
  Parallel Web Systems builds web APIs purpose-built for AI agents: a
  high-accuracy Search API, an Extract API that turns URLs into clean
  LLM-ready markdown, a Task/Deep Research API with tiered processors
  (lite through ultra), FindAll for natural-language entity discovery and
  enrichment, a Monitor API for scheduled web-change tracking, an
  OpenAI-compatible Responses and Chat Completions pair, and a Memory API that
  lets agents reuse past research. The platform is API-key authenticated over
  https://api.parallel.ai, ships official Python and TypeScript SDKs and a
  CLI, emits Standard Webhooks and SSE event streams, and is SOC 2 Type I/II
  certified. Its agent surface is unusually complete: an anonymous hosted MCP
  server whose tools are publicly introspectable, an OAuth-gated Task MCP
  server, a conformant A2A agent card backed by a live /a2a endpoint,
  provider-published Agent Skills with a discovery document, an llms.txt, and
  markdown twins of every documentation page. Pricing is pay-as-you-go per
  request per product. Originally surfaced as a Kleiner Perkins portfolio
  company and enriched from Parallel's public developer surface.
