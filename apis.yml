- aid: parallel:parallel-responses-api-api
  name: Parallel Responses API
  description: >-
    An OpenAI-Responses-compatible interface for answers grounded in live web research, with URL citations.
    Point any Responses-API client — the OpenAI Python SDK, OpenAI TypeScript SDK, the Agents SDK, or
    raw HTTP — at `https://api.parallel.ai` with your Parallel API key, set `model` to `parallel`, and
    call `/v1/responses`.

    - `input` accepts a plain string or an array of role/content messages (canonical OpenAI shape; text
    content only).

    - `reasoning.effort` (`low`/`medium`/`high`) controls how much research is performed, trading response
    time for answer quality.

    - Multi-turn via `previous_response_id`.

    - Structured outputs via `text.format = {"type": "json_schema", "name": ..., "schema": {...}}`.

    - Streaming (`stream=true`) emits the standard OpenAI Responses SSE lifecycle: `response.created`
    and `response.in_progress`, then output item / content part / text delta events with URL-citation
    annotations, the matching `*.done` events, and a terminal `response.completed` — or `response.failed`
    if the request fails mid-stream.
  humanURL: https://docs.parallel.ai/getting-started/overview
  baseURL: https://api.parallel.ai
  tags:
  - Responses API
  properties:
  - type: OpenAPI
    url: openapi/parallel-responses-api-api-openapi.yml
  - type: Documentation
    url: https://docs.parallel.ai/responses-api/responses-quickstart
  - type: APIReference
    url: https://docs.parallel.ai/api-reference
