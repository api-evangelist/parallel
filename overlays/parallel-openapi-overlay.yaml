  update:
    x-apievangelist-oauth-note: >-
      The REST API declares only ApiKeyAuth. OAuth 2.0 (issuer
      https://platform.parallel.ai, scope key:read) is published out-of-band via
      RFC 8414/9728 metadata and governs the MCP and A2A surfaces, not these paths.
