- target: $.info
  update:
    x-apievangelist-rating-notes: >-
      OpenAPI 3.1 with 34 operations across 8 products (Memory and Responses added
      since the July round); API-key auth on REST plus a published OAuth 2.0
      authorization server (PKCE S256, dynamic client registration, scope
      key:read) fronting the Task MCP and the A2A agent; a conformant A2A agent
      card on api.parallel.ai; an anonymous hosted MCP server whose tools/list is
      publicly introspectable; provider-published Agent Skills with a 0.2.0
      discovery document. Gaps: no RFC 9457 problem+json, no idempotency
      contract, no rate-limit response headers, no security.txt or vulnerability
      disclosure program, and no DNSSEC.
